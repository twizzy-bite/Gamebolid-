<style>

#sp{left:10px;bottom:12px;width:150px}#kmh{font-size:56px;font-weight:700;line-height:1}#gr{font-size:34px;color:var(--ac);float:right}
.b{height:6px;background:#fff3;border-radius:3px;overflow:hidden}.b i{display:block;height:100%;width:0;background:var(--ac)}
#tel{right:10px;top:112px;width:132px;font-size:13px;color:var(--dim)}#tel div{margin:2px 0}

 #wheel{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:14px;width:40vw;height:34vh;border-radius:60px;background:#ffffff14;border:2px solid #ffffff33;touch-action:none}
 #knob{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px;border-radius:50%;background:#ffb000cc;pointer-events:none}
 #pedals{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:14px;display:flex;gap:12px;align-items:flex-end}
 .pedal{width:84px;border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:18px;font-weight:700;background:#ffffff18;border:2px solid #ffffff33;touch-action:none}
 #brake{height:30vh}#gas{width:104px;height:48vh;background:#ffb00033;border-color:#ffb00088}.pedal.on{background:#ffb000aa;color:#111}

 #tel{right:auto;left:10px;top:100px;width:104px;font-size:11px}#tel div{margin:1px 0}.b{height:4px}
 h1{font-size:30px}#menu p{margin-bottom:6px}label{margin:5px 0}.k{display:none}
}

<canvas id="c"></canvas>
<div id="hud"><div id="tl"></div><canvas id="map" width="96" height="96"></canvas>
<div id="sp"><span id="gr">N</span><span id="kmh">0</span> км/ч<div class="b"><i id="rpm"></i></div></div>
<div id="tel"></div><div id="msg"></div></div>
<div id="touch"><div id="wheel"><div id="knob"></div></div><div id="pedals"><div id="brake" class="pedal">ТОРМОЗ</div><div id="gas" class="pedal">ГАЗ</div></div><div id="sys"><button data-k="KeyC">📷</button><button data-k="KeyR">↺</button><button data-k="KeyP">⏸</button></div></div><div id="rotate">Поверните телефон горизонтально</div>
<div id="menu"><div class="p"><h1>Apex</h1><p>Одна трасса, один болид, настоящая динамика: перенос веса, прижимная сила, температура шин, повреждения.</p>
<label>Режим<select id="mode"><option value="race">Гонка, 3 круга</option><option value="tt">Заезд на время, 5 кругов</option></select></label>
<label>Сложность ИИ<select id="diff"><option value=".82">Лёгкая</option><option value=".9" selected>Средняя</option><option value=".97">Сложная</option></select></label>

<label>Контроль тяги<input type="checkbox" id="tc"></label>

<button id="go">Старт</button>
<p class="k" style="margin-top:12px">W/↑ газ · S/↓ тормоз · A D/←→ руль · C камера · R вернуть на трассу · P пауза</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const fmt=t=>t==null?'—':Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0');

/* ---------- TrackSystem ---------- */
const T=(()=>{
 const pts=[[0,0,0],[200,-20,2],[420,10,6],[560,120,10],[520,260,14],[380,300,10],[300,380,6],[320,520,12],[200,600,16],[40,560,10],[-60,440,4],[-30,300,0],[-150,220,-4],[-120,60,-2]].map(p=>new THREE.Vector3(p[0],p[2],p[1]));
 const cv=new THREE.CatmullRomCurve3(pts,true,'catmullrom',.5),N=700,S=cv.getSpacedPoints(N).slice(0,N),ds=cv.getLength()/N;
 const o={N,ds,HW:7.5,WALL:15,x:[],y:[],z:[],tx:[],tz:[],nx:[],nz:[],vt:[]};
 S.forEach((p,i)=>{const a=S[(i+1)%N],b=S[(i+N-1)%N];let tx=a.x-b.x,tz=a.z-b.z;const l=Math.hypot(tx,tz);tx/=l;tz/=l;
  o.x.push(p.x);o.y.push(p.y);o.z.push(p.z);o.tx.push(tx);o.tz.push(tz);o.nx.push(tz);o.nz.push(-tx)});
 const hd=o.tx.map((t,i)=>Math.atan2(t,o.tz[i]));
 o.vt=hd.map((_,i)=>{const k=Math.abs(wrap(hd[(i+2)%N]-hd[(i+N-2)%N]))/(4*ds);return Math.min(92,Math.sqrt(26/Math.max(k,1e-4)))});
 for(let n=0;n<2*N;n++){const i=N-1-n%N,j=(i+1)%N;o.vt[i]=Math.min(o.vt[i],Math.sqrt(o.vt[j]**2+60*ds))}
 o.near=(x,z,h)=>{let b=0,bd=1e18;const R=h<0?N/2:15;for(let k=-R;k<R;k++){const i=h<0?k+R:(h+k+N)%N,d=(x-o.x[i])**2+(z-o.z[i])**2;if(d<bd){bd=d;b=i}}return b};
 o.off=(x,z,i)=>(x-o.x[i])*o.nx[i]+(z-o.z[i])*o.nz[i];
 o.yAt=(x,z,i)=>{const t=((x-o.x[i])*o.tx[i]+(z-o.z[i])*o.tz[i])/ds,j=(t>=0?i+1:i+N-1)%N;return o.y[i]+(o.y[j]-o.y[i])*Math.abs(clamp(t,-1,1))};
 o.slope=i=>(o.y[(i+1)%N]-o.y[(i+N-1)%N])/(2*ds);
 return o})();

/* ---------- Renderer, sky, lighting ---------- */
const MOBILE=matchMedia('(pointer:coarse)').matches,maxPixelRatio=Math.min(devicePixelRatio,MOBILE?1.5:2);let pixelRatio=maxPixelRatio;
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(pixelRatio);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xc4d8e8,250,1300);
const cam=new THREE.PerspectiveCamera(68,1,.5,2600);
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

function canvasTexture(w,h,draw,repeat=true){
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;draw(canvas.getContext('2d'),w,h);
 const tex=new THREE.CanvasTexture(canvas);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;
 if(repeat)tex.wrapS=tex.wrapT=THREE.RepeatWrapping;return tex}
function speckle(g,w,h,count,color,size=2){for(let i=0;i<count;i++){g.fillStyle=color();g.fillRect(Math.random()*w,Math.random()*h,size,size)}}
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const surfaceMaterial=(map,roughness=.9)=>new THREE.MeshStandardMaterial({map,roughness,side:THREE.DoubleSide});

const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,24,16),new THREE.MeshBasicMaterial({fog:false,side:THREE.BackSide,
 map:canvasTexture(4,256,(g,w,h)=>{const grad=g.createLinearGradient(0,0,0,h);
  [[0,'#2a67b0'],[.38,'#78aadc'],[.5,'#d3e3ef'],[1,'#d3e3ef']].forEach(([p,c])=>grad.addColorStop(p,c));g.fillStyle=grad;g.fillRect(0,0,w,h)},false)}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xdbe9ff,0x56633a,.9));
const sun=new THREE.DirectionalLight(0xfff0d4,1.3);sun.castShadow=true;sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);sun.shadow.bias=-.0004;
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:10,far:500});sun.shadow.camera.updateProjectionMatrix();
scene.add(sun,sun.target);
const SUN_DIRECTION=new THREE.Vector3(-.5,.8,.35).normalize();
function followSun(x,y,z){sun.position.set(x+SUN_DIRECTION.x*150,y+SUN_DIRECTION.y*150,z+SUN_DIRECTION.z*150);sun.target.position.set(x,y,z)}

/* ---------- Terrain: hills fall away from the circuit ---------- */
const H=T.HW,W=T.WALL,CX=200,CZ=300;
function terrainHeight(x,z){
 let nearest=0,best=1e18;
 for(let i=0;i<T.N;i+=2){const d=(x-T.x[i])**2+(z-T.z[i])**2;if(d<best){best=d;nearest=i}}
 const fade=smooth((Math.sqrt(best)-(W+1))/70),rolling=6*Math.sin(x*.004)*Math.cos(z*.005)+3*Math.sin(x*.013+z*.009);
 return THREE.MathUtils.lerp(T.y[nearest]-1.5,rolling,fade)}
const grassTexture=canvasTexture(256,256,(g,w,h)=>{g.fillStyle='#4d7b39';g.fillRect(0,0,w,h);
 speckle(g,w,h,5000,()=>`hsla(${85+Math.random()*30},45%,${22+Math.random()*22}%,.5)`)});
const terrainTexture=grassTexture.clone();terrainTexture.needsUpdate=true;terrainTexture.repeat.set(170,170);
const terrainGeometry=new THREE.PlaneGeometry(2000,2000,200,200);terrainGeometry.rotateX(-Math.PI/2);
const tp=terrainGeometry.attributes.position;
for(let i=0;i<tp.count;i++)tp.setY(i,terrainHeight(tp.getX(i)+CX,tp.getZ(i)+CZ));
terrainGeometry.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeometry,surfaceMaterial(terrainTexture,1));terrain.position.set(CX,0,CZ);terrain.receiveShadow=true;scene.add(terrain);

/* ---------- Track surface ---------- */
function ribbon(a,ya,b,yb,material,vLength=12,castShadow=false){
 const pos=[],uv=[],index=[];
 for(let i=0;i<=T.N;i++){const k=i%T.N,v=i*T.ds/vLength;
  pos.push(T.x[k]+T.nx[k]*a,T.y[k]+ya,T.z[k]+T.nz[k]*a,T.x[k]+T.nx[k]*b,T.y[k]+yb,T.z[k]+T.nz[k]*b);uv.push(0,v,1,v);
  if(i<T.N){const j=i*2;index.push(j,j+1,j+2,j+1,j+3,j+2)}}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(index);geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,material);mesh.receiveShadow=true;mesh.castShadow=castShadow;scene.add(mesh)}
const asphalt=canvasTexture(512,512,(g,w,h)=>{g.fillStyle='#33363b';g.fillRect(0,0,w,h);
 speckle(g,w,h,30000,()=>`hsla(0,0%,${30+Math.random()*35}%,.3)`);
 for(const centre of [.3,.7]){const grad=g.createLinearGradient((centre-.12)*w,0,(centre+.12)*w,0);   // rubbered-in racing line
  grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(.5,'rgba(0,0,0,.3)');grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.fillRect(0,0,w,h)}
 g.fillStyle='#eceff2';g.fillRect(w*.02,0,w*.016,h);g.fillRect(w*.964,0,w*.016,h)});
const kerb=canvasTexture(64,64,(g,w,h)=>{g.fillStyle='#d5352b';g.fillRect(0,0,w,h/2);g.fillStyle='#f5f5f5';g.fillRect(0,h/2,w,h/2)});
const barrier=canvasTexture(64,128,(g,w,h)=>{g.fillStyle='#d9dde2';g.fillRect(0,0,w,h);g.fillStyle='#c8372d';g.fillRect(w*.4,0,w*.22,h);
 const dirt=g.createLinearGradient(0,0,w*.3,0);dirt.addColorStop(0,'rgba(40,30,20,.55)');dirt.addColorStop(1,'rgba(40,30,20,0)');g.fillStyle=dirt;g.fillRect(0,0,w,h)});
ribbon(-H,0,H,0,surfaceMaterial(asphalt,.85),12);
for(const side of [-1,1]){
 ribbon(side*H,.02,side*(H+1.5),.02,surfaceMaterial(kerb,.7),3);
 ribbon(side*(H+1.5),-.02,side*W,-.02,surfaceMaterial(grassTexture,1),6);
 ribbon(side*W,-1.8,side*W,1.4,surfaceMaterial(barrier,.8),8,true)}

/* ---------- Scenery: start gantry, grandstand, trees, hills ---------- */
function chequered(cols,rows){return canvasTexture(cols*16,rows*16,(g)=>{for(let x=0;x<cols;x++)for(let y=0;y<rows;y++){g.fillStyle=(x+y)%2?'#111':'#f4f4f4';g.fillRect(x*16,y*16,16,16)}},false)}
function buildStartStraight(){
 const group=new THREE.Group(),dark=new THREE.MeshStandardMaterial({color:0x22262d,roughness:.6});
 group.position.set(T.x[0],T.y[0],T.z[0]);group.rotation.y=Math.atan2(T.tx[0],T.tz[0]);
 const box=(w,h,d,x,y,z,material)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;group.add(m)};
 box(.8,8,.8,-(H+2),4,0,dark);box(.8,8,.8,H+2,4,0,dark);
 box(2*(H+2)+.8,1.6,1,0,8,0,new THREE.MeshStandardMaterial({map:chequered(24,2),roughness:.5}));
 const line=new THREE.Mesh(new THREE.PlaneGeometry(2*H,1.6),new THREE.MeshStandardMaterial({map:chequered(20,2),roughness:.6}));
 line.rotation.x=-Math.PI/2;line.position.y=.05;group.add(line);
 const crowd=canvasTexture(128,128,(g,w,h)=>{g.fillStyle='#394150';g.fillRect(0,0,w,h);
  speckle(g,w,h,2500,()=>`hsl(${Math.random()*360},55%,${45+Math.random()*25}%)`,3)});
 crowd.repeat.set(10,4);
 const seats=new THREE.MeshStandardMaterial({map:crowd,roughness:1});
 for(let step=0;step<5;step++)box(4,2.2,90,W+9+step*4,-1+step*2.2+1.1,45,seats);
 box(22,.5,92,W+19,11.5,45,dark);
 scene.add(group)}
buildStartStraight();
(function scatterTrees(count){
 const crowns=new THREE.InstancedMesh(new THREE.ConeGeometry(3.4,11,8),new THREE.MeshStandardMaterial({roughness:1}),count);
 const trunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.5,3,6),new THREE.MeshStandardMaterial({color:0x4a3626,roughness:1}),count);
 const matrix=new THREE.Matrix4(),color=new THREE.Color();let placed=0;
 while(placed<count){
  const x=CX-700+Math.random()*1400,z=CZ-600+Math.random()*1200,i=T.near(x,z,-1);
  if(Math.hypot(x-T.x[i],z-T.z[i])<34)continue;
  const s=.7+Math.random()*.9,base=terrainHeight(x,z);
  matrix.makeScale(s,s,s).setPosition(x,base+(3+5.5)*s,z);crowns.setMatrixAt(placed,matrix);
  matrix.makeScale(s,s,s).setPosition(x,base+1.5*s,z);trunks.setMatrixAt(placed,matrix);
  crowns.setColorAt(placed,color.setHSL(.26+Math.random()*.07,.45,.17+Math.random()*.12));placed++}
 crowns.castShadow=trunks.castShadow=true;scene.add(crowns,trunks);
 const hillMaterial=new THREE.MeshStandardMaterial({color:0x5b7560,roughness:1,flatShading:true});
 for(let k=0;k<16;k++){const angle=k/16*Math.PI*2,hill=new THREE.Mesh(new THREE.ConeGeometry(240,150+Math.random()*120,6),hillMaterial);
  hill.position.set(CX+Math.cos(angle)*1050,40,CZ+Math.sin(angle)*1050);scene.add(hill)}
})(MOBILE?300:500);

/* ---------- Vehicle specification ---------- */
const SPEC={cgToFront:1.6,cgToRear:1.4,wheelbase:3.0,cgHeight:.36,yawInertia:1150,wheelRadius:.33,baseGrip:1.9,gravity:9.81,
 gearRatios:[13,10,8.2,6.9,5.9,5.2,4.7,4.3],peakTorque:600,maxBrakeForce:45000,redline:12500};

const Aerodynamics={
 forces(speed,damage){
  const dynamicPressure=speed*speed,downforce=1.1*dynamicPressure;
  return{front:downforce*.42*(1-.55*damage.front),rear:downforce*.58*(1-.3*damage.rear),drag:.42*dynamicPressure*(1+.5*damage.front)}}};

class EngineAndTransmission{
 constructor(){this.gear=1;this.rpm=5000}
 update(speed){
  this.rpm=Math.max(5000,speed/SPEC.wheelRadius*SPEC.gearRatios[this.gear-1]*60/(2*Math.PI));
  if(this.rpm>12000&&this.gear<8)this.gear++;
  else if(this.rpm<7600&&this.gear>1)this.gear--}
 driveForce(throttle,rearDamage){
  if(this.rpm>SPEC.redline)return 0;
  const torque=SPEC.peakTorque*(1-.5*((this.rpm-9500)/7000)**2);
  return throttle*torque*SPEC.gearRatios[this.gear-1]*.92/SPEC.wheelRadius*(1-.4*rearDamage)}}

class TireModel{
 constructor(){this.temp=55;this.wear=0}
 friction(surface,suspensionDamage){
  const temperatureFactor=clamp(1-.35*((this.temp-95)/50)**2,.45,1);
  return SPEC.baseGrip*surface*temperatureFactor*(1-.4*this.wear)*(1-.3*suspensionDamage)}
 // Friction circle: whatever longitudinal force is used reduces the lateral grip left over.
 resolveLongitudinal(demand,maxForce){
  if(Math.abs(demand)>maxForce)return{force:Math.sign(demand)*maxForce*.85,lateralScale:.4,sliding:true};
  return{force:demand,lateralScale:Math.sqrt(Math.max(.04,1-(demand/maxForce)**2)),sliding:false}}
 lateralForce(slipAngle,maxForce,lateralScale){return -maxForce*lateralScale*Math.sin(1.5*Math.atan(9*slipAngle))}
 thermalUpdate(lateralForce,slipAngle,longForce,maxForce,speed,sliding,dt){
  const heat=Math.abs(lateralForce*slipAngle)*Math.max(speed,5)*.0006+(Math.abs(longForce)/maxForce)**4*20+2+(sliding?35:0);
  const cooling=(this.temp-50)*(.25+speed*.004);
  this.temp=clamp(this.temp+(heat-cooling)*dt,20,180);
  this.wear=Math.min(1,this.wear+(heat*4e-5+(sliding?.009:0))*dt)}}

class BrakeSystem{
 constructor(){this.temp=150}
 force(pedal){
  const fade=1-clamp((this.temp-900)/600,0,.6),total=pedal*SPEC.maxBrakeForce*fade;
  return{front:total*.58,rear:total*.42}}
 heat(power,speed,dt){this.temp=Math.max(100,this.temp+(power*speed*7e-5-(this.temp-100)*(.06+speed*.0015))*dt)}}

const CollisionAndDamage={
 applyImpact(damage,frontness,impactSpeed){
  const zone=frontness>.4?'front':frontness<-.4?'rear':'side';
  damage[zone]=Math.min(1,damage[zone]+Math.max(0,impactSpeed-2)*.012)},
 resolveWall(car){
  const idx=car.idx=T.near(car.x,car.z,car.idx),offset=T.off(car.x,car.z,idx),limit=W-1;car.d=offset;
  if(Math.abs(offset)<=limit)return;
  const side=offset>0?-1:1,nx=T.nx[idx]*side,nz=T.nz[idx]*side,depth=Math.abs(offset)-limit;
  car.x+=nx*depth;car.z+=nz*depth;
  const [wx,wz]=car.vw(),into=wx*nx+wz*nz;if(into>=0)return;
  const fx=Math.sin(car.h),fz=Math.cos(car.h);
  this.applyImpact(car.damage,-(nx*fx+nz*fz),-into);
  const bounceX=(wx-1.2*into*nx)*.93,bounceZ=(wz-1.2*into*nz)*.93;
  car.vx=bounceX*fx+bounceZ*fz;car.vy=bounceX*fz-bounceZ*fx;car.r*=.7}};

class Car{
 constructor(color,isAI){
  Object.assign(this,{ai:isAI,x:0,z:0,h:0,vx:0,vy:0,r:0,steer:0,steerAngle:0,wheelSpin:0,fuel:60,idx:-1,pi:0,lap:0,

function frame(now){requestAnimationFrame(frame);const f=Math.min(.05,(now-last)/1000);last=now;adaptResolution(f);
 if(G.state=='count'||G.state=='run'||G.state=='done'){acc+=f;while(acc>=DT){tick(DT);acc-=DT}}
 render(G.state=='paused'?1:acc/DT);hud()}
const dem=new Car(0xe8322a,false);dem.place(T.N-4,0);G.pl=dem;G.cars=[dem];cam.position.set(-20,6,-30);requestAnimationFrame(frame);
